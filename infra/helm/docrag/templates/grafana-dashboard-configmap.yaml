apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docrag.fullname" . }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  docrag-metrics.json: |
    {
      "title": "DocRAG Agent Performance & Observability",
      "panels": [
        {
          "id": 1,
          "title": "Agent Node Latency (p95)",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(docrag_node_duration_seconds_bucket[5m])) by (le, node_name))" }
          ]
        },
        {
          "id": 2,
          "title": "Validation Pass Rate (%)",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(docrag_validation_pass_total[5m])) / sum(rate(docrag_validation_total[5m])) * 100" }
          ]
        },
        {
          "id": 3,
          "title": "Correction Agent Trigger Rate",
          "type": "timeseries",
          "targets": [
            { "expr": "sum(rate(docrag_correction_triggers_total[5m]))" }
          ]
        }
      ]
    }
