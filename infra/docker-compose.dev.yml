version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docrag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docrag-backend
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_LLM=true
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/docrag
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: docrag-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Optional vLLM service for GPU instances
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: docrag-vllm
  #   runtime: nvidia
  #   environment:
  #     - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
  #   ports:
  #     - "8000:8000"
  #   command: --model Qwen/Qwen2.5-7B-Instruct --gpu-memory-utilization 0.9

volumes:
  postgres_data:
  qdrant_storage:
